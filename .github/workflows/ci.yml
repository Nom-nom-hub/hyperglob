name: CI

# Runs on every push and pull request. The release workflow (release.yml) only
# fires on version tags, so without this there is no automated gate before a
# change is tagged and published.
#
# See docs/PACKAGING_AUDIT.md F6.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # Node 22 has --experimental-test-isolation=none, which the MCP
          # stdio tests need. The package still supports Node 18+, so the
          # "node 18" job below exercises the fallback path.
          node-version: 22
      - run: npm ci
      - name: version parity (package.json vs Cargo.toml)
        run: node tools/check-version.mjs
      - name: platform table drift check
        run: node tools/check-platforms.mjs
      - name: build the native module
        # Must come before check-dts: that check loads index.js, which needs
        # the native binding. Without a staged binary the loader tries to
        # download one from the release page, which does not exist yet for
        # an unreleased commit.
        run: npm run build
      - name: type-definition and ESM-wrapper parity
        run: node tools/check-dts.mjs
      - name: node tests
        # The MCP stdio tests spawn a subprocess, so the suite needs
        # --experimental-test-isolation=none. That flag only exists on Node
        # 22.8+; tools/run-tests.mjs probes for it and falls back to the
        # default per-file isolation on older Node.
        run: node tools/run-tests.mjs
      - name: verify the staged native binary
        run: node tools/verify-native.mjs
      - name: package sanity check
        run: node tools/check-package.mjs
      - name: documentation site is up to date
        # The rendered HTML in docs/ is committed so GitHub Pages can serve
        # it directly. This check guarantees it never drifts from the
        # Markdown source.
        run: node tools/build-site.mjs --check
      - name: documentation agrees with the code
        # The site's own tests (tests/site.test.js) cover rendering, links
        # and anchors; this check covers the docs' claims about behaviour.
        run: node tools/check-docs.mjs

  node-oldest:
    name: node 18 (oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # The package declares node >=18. Node 18 has no
          # --experimental-test-isolation=none, so this job proves the
          # test runner falls back cleanly rather than dying on an
          # unknown flag -- and that the package itself loads and works
          # on the oldest version we claim to support.
          node-version: 18
      - run: npm ci
      - name: build the native module
        run: npm run build
      - name: the package loads and works on Node 18
        run: |
          node -e "
            const h = require('./index.js');
            if (typeof h.hyperglobSync !== 'function') throw new Error('hyperglobSync missing');
            const out = h.hyperglobSync('package.json', { cwd: process.cwd(), pathsOnly: true });
            if (!out.includes('package.json')) throw new Error('scan returned nothing: ' + JSON.stringify(out));
            console.log('node ' + process.version + ': ok');
          "
      - name: node tests
        run: node tools/run-tests.mjs

  package:
    name: package (tarball smoke test)
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: build the native module
        # The tarball ships the .node binary for the platform it was packed
        # on (the "files" list includes hyperglob.*.node). Without this the
        # tarball has no binary, the postinstall downloader has no release
        # to fetch yet, and the installed package cannot load.
        run: npm run build
      - name: pack
        run: npm pack
      - name: install the packed tarball into a scratch project
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz --no-audit --no-fund
          node -e "const h=require('@blazeinstall/hyperglob'); console.log('version:', h.version());"
          npx hyperglob '**/*.json' | head -5
